<title>ESOL Lesson Ideas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#5b6575;--line:#d9dee6;--accent:#1e3c6e;--accent-ink:#fff;--ok:#2e7d4f;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--muted:#9aa5b5;--line:#2c3542;--accent:#8fb3f0;--accent-ink:#0d1420;--ok:#6fcf97;--warn:#f2b45a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--muted:#9aa5b5;--line:#2c3542;--accent:#8fb3f0;--accent-ink:#0d1420;--ok:#6fcf97;--warn:#f2b45a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Calibri,Arial,Verdana,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
h1{font-size:1.4rem;margin:0}
.logo{height:40px;background:#fff;border-radius:6px;padding:2px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:4px 10px;font-weight:400}
button:disabled{opacity:.5}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.msg{color:var(--muted);font-size:.9rem;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400;padding:6px 12px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.idea{border-top:1px solid var(--line);padding:10px 0}
.idea:first-child{border-top:0}
.meta{font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-weight:600;color:var(--accent)}
.used{color:var(--ok);font-weight:600}
.note{white-space:pre-wrap;margin:4px 0}
.idea .thumbs a img{width:96px;height:96px}
</style>

  <div class="card" id="formCard">
    <div class="row">
      <div><label for="cls">Class</label>
        <select id="cls"><option>Any</option><option>E1 (Tue)</option><option>E2 (Thu)</option><option>E3 (Mon/Wed)</option></select></div>
      <div><label for="when">When (optional)</label><input type="text" id="when" placeholder="e.g. next lesson, WC 16 Nov"></div>
    </div>
    <label for="note">Idea or instructions</label>
    <textarea id="note" placeholder="e.g. Use these Ridley Road photos for picture description"></textarea>
    <label for="files">Photos or files (optional)</label>
    <input type="file" id="files" multiple accept="image/*,application/pdf,text/plain">
    <div class="thumbs" id="preview"></div>
    <div style="margin-top:12px"><button id="save">Add idea</button></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div id="list"><p class="msg">Loading…</p></div>
  </div>
</div>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const msg = t => { $('msg').textContent = t; };
  let filter = 'Waiting', ideas = [];
  const tabs = ['Waiting', 'Used', 'All'];
  function renderTabs() {
    $('tabs').replaceChildren(...tabs.map(t => { const b = document.createElement('button'); b.textContent = t; if (t === filter) b.className = 'on'; b.onclick = () => { filter = t; renderTabs(); render(); }; return b; }));
  }
  renderTabs();
  $('files').onchange = () => {
    $('preview').replaceChildren(...[...$('files').files].filter(f => f.type.startsWith('image/')).map(f => { const i = document.createElement('img'); i.src = URL.createObjectURL(f); return i; }));
  };
  const [db, assets] = await Promise.all([claude.use('db'), claude.use('assets')]);
  if (!db) { $('list').innerHTML = '<p class="msg">Sign in to claude.ai to see and add ideas.</p>'; $('save').disabled = true; return; }
  if (!assets) { $('files').disabled = true; msg('Photo upload is only available to you as the owner.'); }
  const col = db.collection('ideas');
  function render() {
    const shown = ideas.filter(i => filter === 'All' || (filter === 'Used' ? i.used : !i.used));
    if (!shown.length) { $('list').innerHTML = '<p class="msg">' + (filter === 'Waiting' ? 'No ideas waiting.' : 'Nothing here yet.') + '</p>'; return; }
    $('list').replaceChildren(...shown.map(i => {
      const d = document.createElement('div'); d.className = 'idea';
      const m = document.createElement('div'); m.className = 'meta';
      const t = document.createElement('span'); t.className = 'tag'; t.textContent = i.cls || 'Any'; m.append(t);
      if (i.when) { const w = document.createElement('span'); w.textContent = i.when; m.append(w); }
      const dt = document.createElement('span'); dt.textContent = i.createdAt ? new Date(i.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''; m.append(dt);
      if (i.used) { const u = document.createElement('span'); u.className = 'used'; u.textContent = '✓ used' + (i.usedIn ? ': ' + i.usedIn : ''); m.append(u); }
      const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'Delete';
      del.onclick = async () => { if (del.textContent !== 'Sure?') { del.textContent = 'Sure?'; return; } try { await col.doc(i.id).delete(); for (const a of i.assets || []) { try { await assets?.delete(a.id); } catch (e) {} } } catch (e) { msg('Could not delete: ' + (e.message || e.code)); } };
      m.append(del);
      d.append(m);
      if (i.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = i.note; d.append(n); }
      if (i.assets?.length) {
        const th = document.createElement('div'); th.className = 'thumbs';
        for (const a of i.assets) { const l = document.createElement('a'); l.href = '/_blob/' + a.id; l.target = '_blank';
          if ((a.type || '').startsWith('image/')) { const im = document.createElement('img'); im.src = '/_blob/' + a.id; im.alt = a.name || ''; l.append(im); } else { l.textContent = a.name || 'file'; }
          th.append(l); }
        d.append(th);
      }
      return d;
    }));
  }
  col.onSnapshot(s => { ideas = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')); render(); },
    e => { $('list').innerHTML = '<p class="msg">Could not load ideas (' + e.code + ').</p>'; });
  $('save').onclick = async () => {
    const note = $('note').value.trim(), files = [...$('files').files];
    if (!note && !files.length) { msg('Add a note or a photo first.'); return; }
    $('save').disabled = true;
    try {
      const up = [];
      for (const [k, f] of files.entries()) { msg('Uploading ' + (k + 1) + ' of ' + files.length + '…'); const r = await assets.upload(f); up.push({ id: r.id, name: f.name, type: r.contentType }); }
      await col.add({ cls: $('cls').value, when: $('when').value.trim(), note, assets: up, used: false, createdAt: new Date().toISOString() });
      $('note').value = ''; $('when').value = ''; $('files').value = ''; $('preview').replaceChildren();
      msg('Added. It will go into the next matching lesson.'); filter = 'Waiting'; renderTabs(); render();
    } catch (e) { msg('Could not save: ' + (e.message || e.code)); }
    $('save').disabled = false;
  };
})();
</script>

</body></html>
